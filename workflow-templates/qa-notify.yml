# ─────────────────────────────────────────────────────────────────────────────
# QA Queue Notifier — copy to .github/workflows/qa-notify.yml in each repo
# that should feed into the central QA queue at approovia-app/qa-dashboard.
#
# Required secret in the source repo:
#   QA_DISPATCH_TOKEN — fine-grained PAT with:
#     • Actions: write   on approovia-app/qa-dashboard
#
# Runner: uses the org choose-runner pattern — all jobs run on self-hosted
# runners. No job may name a GitHub-hosted runner directly (ubuntu-*, etc.)
# as that bypasses the unmetered pool and incurs billed minutes.
# ─────────────────────────────────────────────────────────────────────────────
name: Notify QA Queue

on:
  pull_request:
    types: [closed]
    branches: [development, main]

jobs:
  choose-runner:
    runs-on: [self-hosted, chooser]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Pick runner pool
        id: pick
        run: echo 'label=["self-hosted","linux","x64"]' >> "$GITHUB_OUTPUT"

  notify:
    needs: choose-runner
    if: github.event.pull_request.merged == true
    runs-on: ${{ fromJson(needs.choose-runner.outputs.label) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch to QA queue
        run: |
          gh api repos/approovia-app/qa-dashboard/dispatches \
            --method POST \
            -f event_type="pr-merged" \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[pr_number]=${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
